[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visionweave"
version = "0.1.0"
description = "Routed visual token compression integrated with SGLang"
readme = "README.md"
license-files = ["LICENSES/*.txt", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2,<3"]

[project.scripts]
visionweave-serve = "visionweave.serve:main"
visionweave-prepare = "visionweave.prepare:main"

[tool.setuptools.packages.find]
include = ["visionweave*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
